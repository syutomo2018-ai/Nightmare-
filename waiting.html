<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>現在の待機人数</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: sans-serif;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
    }

    h1 {
      font-size: 30px;
    }

    .number {
      font-size: 70px;
      font-weight: bold;
      margin: 30px 0;
    }

    p {
      font-size: 18px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎪 悪夢のサーカス</h1>

    <p>現在の待機人数</p>

    <div class="number" id="waitingNumber">
      読み込み中...
    </div>

    <p>人が並んでいます。</p>

    <button onclick="loadWaiting()">
      更新
    </button>

  </div>


  <script>

    function loadWaiting() {

      fetch("https://script.google.com/macros/s/AKfycbwarM5SxuW9HaT9zc_ZRatqPO7VmRmaxkPWcYzDp8DXEGVZWtuPc8yxeSNOzNEEMuQo4Q/exec?action=waiting")
        .then(response => response.text())
        .then(count => {

          document.getElementById("waitingNumber").textContent = count;

        })
        .catch(error => {

          document.getElementById("waitingNumber").textContent = "？";

          console.log(error);

        });

    }

    loadWaiting();

  </script>

</body>

</html>
