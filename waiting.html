<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>悪夢のサーカス - 待機人数</title>

  <style>

    body {
      margin: 0;
      min-height: 100vh;

      background: #080808;
      color: white;

      font-family: sans-serif;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 40px;
    }

    .label {
      font-size: 20px;
    }

    .number {
      font-size: 70px;
      font-weight: bold;
      margin: 15px 0 30px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>🎪 悪夢のサーカス</h1>

    <div class="label">
      現在の待機人数
    </div>

    <div class="number" id="waitingNumber">
      読み込み中...
    </div>

    <div class="label">
      人が並んでいます
    </div>

    <br>

    <button onclick="updateWaiting()">
      更新する
    </button>

  </div>


  <script>

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbwarM5SxuW9HaT9zc_ZRatqPO7VmRmaxkPWcYzDp8DXEGVZWtuPc8yxeSNOzNEEMuQo4Q/exec";


    function updateWaiting() {

      document.getElementById("waitingNumber").textContent =
        "読み込み中...";


      fetch(GAS_URL + "?action=waiting")

        .then(response => response.text())

        .then(count => {

          document.getElementById("waitingNumber").textContent =
            count;

        })

        .catch(error => {

          document.getElementById("waitingNumber").textContent =
            "？";

          console.log(error);

        });

    }


    updateWaiting();

  </script>

</body>

</html>
