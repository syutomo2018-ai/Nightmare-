<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>悪夢のサーカス - 人数確認</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: sans-serif;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
    }

    h1 {
      font-size: 30px;
    }

    .title {
      font-size: 20px;
      margin-top: 35px;
    }

    .number {
      font-size: 60px;
      font-weight: bold;
      margin: 10px 0;
    }

    p {
      font-size: 18px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎪 悪夢のサーカス</h1>

    <div class="title">
      現在の待機人数
    </div>

    <div class="number" id="waitingNumber">
      読み込み中...
    </div>

    <p>人が並んでいます。</p>


    <div class="title">
      合計来場者数
    </div>

    <div class="number" id="visitorNumber">
      読み込み中...
    </div>

    <p>人が来場しました。</p>


    <button onclick="loadData()">
      更新
    </button>

  </div>

  <script>

    function loadData() {

      // 待機人数
      fetch("https://script.google.com/macros/s/AKfycbwarM5SxuW9HaT9zc_ZRatqPO7VmRmaxkPWcYzDp8DXEGVZWtuPc8yxeSNOzNEEMuQo4Q/exec?action=waiting")
        .then(response => response.text())
        .then(waiting => {

          document.getElementById("waitingNumber").textContent = waiting;

        });


      // 合計来場者数
      fetch("https://script.google.com/macros/s/AKfycbwarM5SxuW9HaT9zc_ZRatqPO7VmRmaxkPWcYzDp8DXEGVZWtuPc8yxeSNOzNEEMuQo4Q/exec?action=total")
        .then(response => response.text())
        .then(total => {

          document.getElementById("visitorNumber").textContent = total;

        });

    }

    loadData();

  </script>

</body>

</html>
