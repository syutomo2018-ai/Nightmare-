<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>悪夢のサーカス - 受付</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: sans-serif;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    p {
      font-size: 18px;
      line-height: 2;
    }

    .number {
      font-size: 60px;
      font-weight: bold;
      margin: 20px 0;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎪 悪夢のサーカス</h1>

    <p>受付を登録しました。</p>

    <p>現在の待機人数</p>

    <div class="number" id="waitingNumber">
      読み込み中...
    </div>

    <p>人が並んでいます。</p>

    <p>順番までお待ちください。</p>

  </div>

  <script>

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbwarM5SxuW9HaT9zc_ZRatqPO7VmRmaxkPWcYzDp8DXEGVZWtuPc8yxeSNOzNEEMuQo4Q/exec";

    fetch(GAS_URL + "?action=join")

      .then(response => response.text())

      .then(count => {

        document.getElementById(
          "waitingNumber"
        ).textContent = count;

      })

      .catch(error => {

        document.getElementById(
          "waitingNumber"
        ).textContent = "？";

        console.log(error);

      });

  </script>

</body>
</html>
